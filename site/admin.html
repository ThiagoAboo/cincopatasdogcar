<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administração – Cinco Patas Dog Car & Walker</title>
  
  <!-- Tailwind CSS CDN -->
  <script>
    const _warn = console.warn;
    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _warn.apply(console, args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 font-sans">

  <!-- LOGIN MODAL -->
  <div id="login-screen" class="flex min-h-screen items-center justify-center p-4 bg-slate-900/40 backdrop-blur">
    <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl">
      <div class="text-center mb-6">
        <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-gold-gradient text-slate-900 font-bold text-xl shadow">🐾</div>
        <h2 class="text-2xl font-bold text-slate-900">Painel Restrito</h2>
        <p class="text-sm text-slate-500 mt-1">Faça login para alterar as configurações</p>
      </div>
      <form id="form-login" onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Usuário</label>
          <input id="login-user" type="text" placeholder="thiagoaboo" value="thiagoaboo" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Senha</label>
          <input id="login-pass" type="password" placeholder="••••••" value="123456" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div id="login-error" class="text-xs text-red-600 font-medium"></div>
        <button type="submit" class="w-full py-3 rounded-xl bg-slate-900 text-white font-semibold hover:bg-slate-800 transition">Entrar</button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard-screen" class="hidden min-h-screen flex-col">
    <header class="bg-slate-900 px-6 py-4 text-white shadow-md">
      <div class="mx-auto flex max-w-5xl items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="grid h-10 w-10 place-items-center rounded-xl bg-gold-gradient text-slate-900 font-bold">🐾</div>
          <h1 class="text-xl font-bold">Administração</h1>
        </div>
        <button onclick="handleAdminLogout()" class="px-3.5 py-1.5 rounded-lg border border-white/20 text-xs font-semibold hover:bg-white/10 transition">
          Sair
        </button>
      </div>
    </header>

    <main class="mx-auto mt-8 max-w-5xl px-4 pb-20 w-full">
      <!-- Tabs -->
      <div class="mb-6 flex gap-2 border-b border-slate-200">
        <button id="tab-btn-settings" onclick="switchTab('settings')" class="px-4 py-2 text-sm font-semibold border-b-2 border-slate-900 text-slate-900">
          ⚙️ Configurações
        </button>
        <button id="tab-btn-security" onclick="switchTab('security')" class="px-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-900">
          🔒 Segurança
        </button>
      </div>

      <!-- Settings Tab -->
      <div id="tab-content-settings" class="rounded-2xl bg-white p-6 shadow-md border border-slate-200">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
          <div>
            <h2 class="text-xl font-bold text-slate-900">Configurações Globais (JSON)</h2>
            <p class="text-sm text-slate-500">Edite o JSON completo das configurações do sistema.</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="formatJsonSettings()" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold hover:bg-slate-200 transition">
              ✨ Formatar JSON
            </button>
            <button type="button" onclick="resetDefaultSettings()" class="px-3 py-1.5 rounded-lg bg-red-50 text-red-600 text-xs font-semibold hover:bg-red-100 transition">
              🔄 Restaurar Padrões
            </button>
          </div>
        </div>

        <form id="form-settings" onsubmit="handleSaveSettings(event)" class="space-y-4">
          <div>
            <textarea id="json-settings-input" rows="22" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-4 font-mono text-sm text-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400 leading-relaxed shadow-inner" spellcheck="false"></textarea>
            <div id="json-error" class="mt-2 text-xs font-semibold text-red-500"></div>
          </div>
          
          <div class="flex items-center gap-4 border-t pt-4">
            <button type="submit" class="px-6 py-3 rounded-xl bg-gold-gradient font-bold text-slate-900 shadow hover:opacity-95 transition">
              💾 Salvar Alterações
            </button>
            <span id="save-status" class="text-sm font-semibold text-emerald-600"></span>
          </div>
        </form>
      </div>

      <!-- Security Tab -->
      <div id="tab-content-security" class="hidden max-w-md rounded-2xl bg-white p-6 shadow-md border border-slate-200">
        <h2 class="text-xl font-bold text-slate-900">Credenciais de Acesso</h2>
        <p class="text-sm text-slate-500 mb-6">Altere o usuário e senha para acessar este painel.</p>

        <form onsubmit="handleUpdateSecurity(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Novo Usuário</label>
            <input id="sec-user" type="text" value="thiagoaboo" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nova Senha</label>
            <input id="sec-pass" type="text" value="123456" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-slate-900 text-white font-semibold hover:bg-slate-800 transition">
            Atualizar Credenciais
          </button>
          <div id="sec-status" class="text-xs font-semibold text-center mt-2"></div>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    let currentConfig = getSettings();

    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("admin_logged") === "true") {
        showDashboard();
      }
    });

    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById("login-user").value;
      const pass = document.getElementById("login-pass").value;
      const err = document.getElementById("login-error");

      const savedUser = localStorage.getItem("admin_user") || "thiagoaboo";
      const savedPass = localStorage.getItem("admin_pass") || "123456";

      if (user === savedUser && pass === savedPass) {
        localStorage.setItem("admin_logged", "true");
        showDashboard();
      } else {
        err.innerText = "Usuário ou senha inválidos.";
      }
    }

    function handleAdminLogout() {
      localStorage.removeItem("admin_logged");
      document.getElementById("dashboard-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
    }

    function showDashboard() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("dashboard-screen").classList.remove("hidden");
      document.getElementById("dashboard-screen").classList.add("flex");
      renderSettingsFields();
    }

    function renderSettingsFields() {
      const input = document.getElementById("json-settings-input");
      if (!input) return;
      input.value = JSON.stringify(currentConfig, null, 2);
    }

    function formatJsonSettings() {
      const input = document.getElementById("json-settings-input");
      const err = document.getElementById("json-error");
      if (!input) return;
      try {
        const parsed = JSON.parse(input.value);
        input.value = JSON.stringify(parsed, null, 2);
        if (err) err.innerText = "";
      } catch (e) {
        if (err) err.innerText = "❌ JSON inválido: " + e.message;
      }
    }

    function resetDefaultSettings() {
      if (confirm("Tem certeza que deseja restaurar as configurações padrão?")) {
        currentConfig = Object.assign({}, DEFAULT_SETTINGS);
        renderSettingsFields();
        localStorage.removeItem("app_settings");
        const status = document.getElementById("save-status");
        status.innerText = "🔄 Padrões restaurados!";
        setTimeout(() => { status.innerText = ""; }, 3000);
      }
    }

    function handleSaveSettings(e) {
      e.preventDefault();
      const input = document.getElementById("json-settings-input");
      const err = document.getElementById("json-error");
      const status = document.getElementById("save-status");
      if (!input) return;

      try {
        const updated = JSON.parse(input.value);
        localStorage.setItem("app_settings", JSON.stringify(updated));
        currentConfig = updated;
        if (typeof settings !== "undefined") {
          Object.assign(settings, updated);
        }
        if (err) err.innerText = "";
        status.innerText = "✅ Configurações salvas com sucesso!";
        setTimeout(() => { status.innerText = ""; }, 3000);
      } catch (e) {
        if (err) err.innerText = "❌ Erro ao salvar: JSON inválido - " + e.message;
        status.innerText = "";
      }
    }

    function switchTab(tab) {
      if (tab === 'settings') {
        document.getElementById('tab-content-settings').classList.remove('hidden');
        document.getElementById('tab-content-security').classList.add('hidden');
        document.getElementById('tab-btn-settings').className = "px-4 py-2 text-sm font-semibold border-b-2 border-slate-900 text-slate-900";
        document.getElementById('tab-btn-security').className = "px-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-900";
      } else {
        document.getElementById('tab-content-settings').classList.add('hidden');
        document.getElementById('tab-content-security').classList.remove('hidden');
        document.getElementById('tab-btn-settings').className = "px-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-900";
        document.getElementById('tab-btn-security').className = "px-4 py-2 text-sm font-semibold border-b-2 border-slate-900 text-slate-900";
      }
    }

    function handleUpdateSecurity(e) {
      e.preventDefault();
      const u = document.getElementById("sec-user").value;
      const p = document.getElementById("sec-pass").value;
      localStorage.setItem("admin_user", u);
      localStorage.setItem("admin_pass", p);
      const st = document.getElementById("sec-status");
      st.className = "text-xs font-semibold text-center mt-2 text-emerald-600";
      st.innerText = "Credenciais atualizadas!";
      setTimeout(() => { st.innerText = ""; }, 3000);
    }
  </script>
</body>
</html>
